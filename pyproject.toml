[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "house-prediction"
version = "0.1.0"
description = "A production-oriented house price prediction service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "joblib>=1.4,<2.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "scikit-learn>=1.5,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
house-profile = "house_prediction.data.profile:main"
house-clean = "house_prediction.data.cleaner:main"
house-train = "house_prediction.training.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 200
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"